<!DOCTYPE html>
<html>
<head>
  <title>Assignment Submission Portal</title>
</head>
<body>
  <h2>Submit Assignment</h2>
  <form id="submissionForm">
    <input type="text" name="student" placeholder="Student Name" required />
    <input type="file" name="assignmentFile" required />
    <button type="submit">Submit</button>
  </form>
  <script src="submission_backend.js"></script>
</body>
</html>

FROM node:18-alpine AS build
WORKDIR /app
COPY package*.json ./
RUN npm install
COPY . .
RUN npm run build
FROM nginx:alpine
COPY --from=build /app/dist /usr/share/nginx/html
EXPOSE 80
CMD ["nginx", "-g", "daemon off;"]
